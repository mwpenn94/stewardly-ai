name: Test Suite (Vitest + Playwright)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test
  CI: true

jobs:
  unit-tests:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: pnpm test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || '' }}
          JWT_SECRET: test-secret-for-ci
          VITE_APP_ID: test-app-id
          OAUTH_SERVER_URL: https://api.manus.im
          VITE_OAUTH_PORTAL_URL: https://manus.im
          BUILT_IN_FORGE_API_URL: https://forge.manus.im
          BUILT_IN_FORGE_API_KEY: test-key
          VITE_FRONTEND_FORGE_API_KEY: test-key
          VITE_FRONTEND_FORGE_API_URL: https://forge.manus.im

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build application
        run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || '' }}
          JWT_SECRET: test-secret-for-ci
          VITE_APP_ID: test-app-id
          OAUTH_SERVER_URL: https://api.manus.im
          VITE_OAUTH_PORTAL_URL: https://manus.im
          BUILT_IN_FORGE_API_URL: https://forge.manus.im
          BUILT_IN_FORGE_API_KEY: test-key
          VITE_FRONTEND_FORGE_API_KEY: test-key
          VITE_FRONTEND_FORGE_API_URL: https://forge.manus.im

      - name: Start server
        run: |
          pnpm start &
          sleep 10
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || '' }}
          JWT_SECRET: test-secret-for-ci
          VITE_APP_ID: test-app-id
          OAUTH_SERVER_URL: https://api.manus.im
          VITE_OAUTH_PORTAL_URL: https://manus.im
          BUILT_IN_FORGE_API_URL: https://forge.manus.im
          BUILT_IN_FORGE_API_KEY: test-key
          VITE_FRONTEND_FORGE_API_KEY: test-key
          VITE_FRONTEND_FORGE_API_URL: https://forge.manus.im

      - name: Run Playwright tests (desktop)
        run: npx playwright test --project=desktop-chrome
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    if: always()

    steps:
      - name: Report status
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Vitest Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Playwright E2E | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
